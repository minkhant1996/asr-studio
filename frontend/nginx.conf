server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 250m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8767;

    location /api/ {
        proxy_pass $backend;          # no URI part: nginx forwards the original /api/... path
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;          # keep NDJSON training progress live
        proxy_read_timeout 86400s;    # training runs can be long
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
